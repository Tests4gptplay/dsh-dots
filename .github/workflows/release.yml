name: Publish release

# Release is triggered only for versioned release-note changes (or manually).
# Normal source pushes cannot publish. Native DSH Desktop login remains a user acceptance test.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/releases/dsh-dot-mcp-v*.md'

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Validate production and mock-test boundaries
        run: |
          npm test
          npm run pack:check
          git diff --exit-code -- lib THIRD-PARTY-NOTICES.txt
      - name: Ensure release notes and version match
        id: release
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test -f "docs/releases/dsh-dot-mcp-v${VERSION}.md"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=dsh-dot-mcp-v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Resolve release-note links against the immutable version tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import posixpath
          import re
          from pathlib import Path
          version = os.environ['VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          source = Path('docs/releases') / f'dsh-dot-mcp-v{version}.md'
          markdown = source.read_text(encoding='utf-8')
          def resolve_link(match):
              label, target = match.groups()
              if target.startswith(('https://', 'http://', 'mailto:', '#')):
                  return match.group(0)
              filename, sep, fragment = target.partition('#')
              if not filename:
                  return match.group(0)
              repo_path = posixpath.normpath('docs/releases/' + filename)
              base = (f'https://raw.githubusercontent.com/{repo}/dsh-dot-mcp-v{version}/'
                      if label.startswith('!') else f'https://github.com/{repo}/blob/dsh-dot-mcp-v{version}/')
              return f'{label}({base}{repo_path}{sep}{fragment})'
          resolved = re.sub(r'(!?\[[^\]\n]+\])\(([^)\s]+)\)', resolve_link, markdown)
          Path('release-notes-for-github.md').write_text(resolved, encoding='utf-8')
          PY
      - name: Create exact release TGZ (no install scripts)
        run: npm pack --ignore-scripts
      - name: Record release archive SHA-256
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: sha256sum "dsh-dot-mcp-${VERSION}.tgz" > SHA256SUMS.txt
      - name: Verify release TGZ installs with pnpm
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          npm install -g pnpm@10
          mkdir -p _release-pnpm-test
          cd _release-pnpm-test
          printf '%s\n' '{"name":"dsh-dot-mcp-release-install-check","private":true}' > package.json
          pnpm add "../dsh-dot-mcp-${VERSION}.tgz" --ignore-scripts --config.auto-install-peers=false
      - name: Publish version tag and release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keep immutable tag and assets"
            exit 1
          fi
          gh release create "$TAG" "dsh-dot-mcp-${VERSION}.tgz" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DSH Dot MCP $TAG" --latest \
            --notes-file "release-notes-for-github.md"
