name: Publish release

# Release is triggered only for versioned release-note changes (or manually).
# Normal source pushes cannot publish. Native DSH Desktop login remains a user acceptance test.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/releases/v*.md'

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout DSH interface contract sources
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.1-rc.3
          path: _dsh-host-source
          sparse-checkout: |
            packages/client/ui-schedule/src/client
            packages/client/ui-sidebar-browser
            apps/desktop/src/browser-guests.ts
            apps/desktop/src/preload-browser.ts
      - name: Validate production and mock-test boundaries
        env:
          DSH_SOURCE_DIR: _dsh-host-source
        run: |
          npm test
          npm run pack:check
          git diff --exit-code -- lib/host.js lib/client.js
      - name: Ensure release notes and version match
        id: release
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test -f "docs/releases/v${VERSION}.md"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create exact release TGZ (no install scripts)
        run: npm pack --ignore-scripts
      - name: Verify release TGZ installs with pnpm
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          npm install -g pnpm@10
          mkdir -p _release-pnpm-test
          cd _release-pnpm-test
          printf '%s\n' '{"name":"dsh-dots-release-install-check","private":true}' > package.json
          pnpm add "../dsh-dots-${VERSION}.tgz" --ignore-scripts --config.auto-install-peers=false
      - name: Publish version tag and release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # One-time, user-authorized in-place repair of v0.1.1 only.
            if [ "$TAG" != "v0.1.1" ]; then
              echo "Release $TAG already exists; refusing silent overwrite"
              exit 1
            fi
            OLD_REF=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
            if [ "$OLD_REF" != "ab77253053e7815a6c38b9d3bdc75d957feb00bd" ]; then
              echo "Repair already applied or tag changed; stop without replacing assets"
              exit 1
            fi
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload "$TAG" "dsh-dots-${VERSION}.tgz" --clobber
            gh release edit "$TAG" --notes-file "docs/releases/$TAG.md" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "dsh-dots-${VERSION}.tgz" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "DSH Dots $TAG" --latest \
              --notes-file "docs/releases/$TAG.md"
          fi
