name: Publish prerelease

# A release is explicitly requested by changing its versioned release note on
# main (or by running workflow_dispatch). Normal source pushes do not publish.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/releases/v*.md'

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check DSH API surface against pinned test fixture
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.1-rc.3
          path: _dsh-host-source
          sparse-checkout: |
            packages/client/ui-schedule/src/client
            packages/client/ui-sidebar-browser
      - name: Validate code, mock-test boundaries and production package
        env:
          DSH_SOURCE_DIR: _dsh-host-source
        run: |
          npm test
          npm run pack:check
          git diff --exit-code -- lib/host.js lib/client.js
      - name: Ensure release notes and package version match
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          test -f "docs/releases/v${VERSION}.md"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create exact release TGZ without install scripts
        run: npm pack --ignore-scripts
      - name: Publish immutable version tag and release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" "dsh-dots-${VERSION}.tgz" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DSH Dots $TAG" --prerelease \
            --notes-file "docs/releases/$TAG.md"
