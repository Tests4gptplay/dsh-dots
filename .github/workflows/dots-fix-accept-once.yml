name: Dots MCP and tunnel bug regression
on:
  push:
    branches: ['2.0.1-test.5']
    paths: ['.github/workflows/dots-fix-accept-once.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the exact branch and run both focused regressions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
          node --test tests/mcp-lifecycle-fixes.test.mjs
          mkdir -p _official
          gh api repos/openai/tunnel-client/releases/latest > _official/release.json
          tag=$(node -p 'require("./_official/release.json").tag_name')
          gh release download "$tag" --repo openai/tunnel-client --pattern "tunnel-client-$tag-linux-amd64.zip" --dir _official
          DOTS_TUNNEL_OFFICIAL_DIR="$PWD/_official" node --test tests/tunnel-official.test.mjs
      - name: Full regression and final package
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run pack:check
          npm pack --ignore-scripts
          mkdir -p _unpacked
          tar -xzf dsh-dots-2.0.1-test.5.tgz -C _unpacked
          node --check _unpacked/package/lib/host.js
          node --check _unpacked/package/lib/mcp-control.mjs
          node --check _unpacked/package/lib/tunnel-control.mjs
          sha256sum dsh-dots-2.0.1-test.5.tgz > SHA256SUMS.txt
      - name: Commit built production output after passing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/2.0.1-test.5" --jq .object.sha)
          test "$actual" = "$GITHUB_SHA"
          git add lib THIRD-PARTY-NOTICES.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(dots): verify MCP close and tunnel binary switch fixes'
            git push origin HEAD:2.0.1-test.5
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dots-mcp-close-tunnel-update-acceptance
          path: |
            dsh-dots-2.0.1-test.5.tgz
            SHA256SUMS.txt
          retention-days: 14
