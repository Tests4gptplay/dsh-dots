name: Dots tunnel integration inputs
on:
  push:
    branches: ['2.0.1-test.2']
    paths: ['.github/workflows/tunnel-inputs-once.yml']
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare build dependency and official client archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install --save-dev --save-exact fflate --legacy-peer-deps --no-audit --no-fund
          mkdir -p _official
          gh api repos/openai/tunnel-client/releases/latest > _official/release.json
          tag=$(node -p 'require("./_official/release.json").tag_name')
          gh release download "$tag" --repo openai/tunnel-client --pattern "tunnel-client-$tag-linux-amd64.zip" --pattern "tunnel-client-$tag-windows-amd64.zip" --pattern SHA256SUMS.txt --dir _official
          gh api "repos/openai/tunnel-client/contents/docs/configuration.md?ref=$tag" --jq .content | base64 -d > _official/configuration.md
          gh api "repos/openai/tunnel-client/contents/docs/onboarding.md?ref=$tag" --jq .content | base64 -d > _official/onboarding.md
          cp "$(command -v node)" _official/node
          git rev-parse HEAD > _official/input-commit.txt
          tar --exclude='./.git' -czf "$RUNNER_TEMP/dots-tunnel-inputs.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: dots-tunnel-inputs
          path: ${{ runner.temp }}/dots-tunnel-inputs.tar.gz
          retention-days: 3
