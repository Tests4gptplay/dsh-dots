name: Dot MCP candidate build sync
on:
  push:
    branches: ['fix/dot-mcp-direct-tools-sidebar']
    paths: ['src/**', 'tests/**', 'package.json', 'package-lock.json', 'README*', 'CHANGELOG.md', '.github/workflows/dot-mcp-build-sync.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exactly locked source files
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
          npm run pack:check
          npm pack --ignore-scripts
      - name: Synchronize compiled production files for the candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const target = 'packages/dsh-dot-mcp'
          for (const item of pkg.files) {
            const files = item === 'locale/*.json' ? fs.readdirSync('locale').filter(x => x.endsWith('.json')).map(x => 'locale/' + x) : [item]
            for (const file of files) { fs.mkdirSync(path.dirname(path.join(target, file)), { recursive: true }); fs.copyFileSync(file, path.join(target, file)) }
          }
          delete pkg.scripts; delete pkg.devDependencies
          fs.writeFileSync(path.join(target, 'package.json'), JSON.stringify(pkg, null, 2) + '\n')
          JS
          git add lib THIRD-PARTY-NOTICES.txt packages/dsh-dot-mcp
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(dot-mcp): synchronize compiled 1.0.1-test.2 runtime"
            git push origin HEAD:fix/dot-mcp-direct-tools-sidebar
          fi
