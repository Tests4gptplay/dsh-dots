name: Dot MCP candidate build sync
on:
  push:
    branches: ['fix/dot-mcp-direct-tools-sidebar']
    paths: ['src/**', 'tests/**', 'package.json', 'package-lock.json', 'README*', 'CHANGELOG.md', '.github/workflows/dot-mcp-build-sync.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exactly locked source files
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
          npm run pack:check
          npm pack --ignore-scripts
      - name: Synchronize compiled production files for the candidate
        shell: bash
        run: |
          set -euo pipefail
          cp lib/client.js lib/mcp-adapter.mjs lib/mcp-server.mjs packages/dsh-dot-mcp/lib/
          cp THIRD-PARTY-NOTICES.txt packages/dsh-dot-mcp/
          git add lib THIRD-PARTY-NOTICES.txt packages/dsh-dot-mcp/lib packages/dsh-dot-mcp/THIRD-PARTY-NOTICES.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(dot-mcp): synchronize compiled 1.0.1-test.1 runtime"
            git push origin HEAD:fix/dot-mcp-direct-tools-sidebar
          fi
