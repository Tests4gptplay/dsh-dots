name: Dots 2.0.1-test.6 lifecycle and packaging acceptance
on:
  push:
    branches: ['2.0.1-test.6']
    paths: ['.github/workflows/dots-lifecycle-accept-once.yml']
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full build, source tests and package whitelist
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm test
          npm run pack:check
          npm pack --ignore-scripts
          mkdir -p _unpacked
          tar -xzf dsh-dots-2.0.1-test.6.tgz -C _unpacked
          node --check _unpacked/package/lib/host.js
          node --check _unpacked/package/lib/mcp-control.mjs
          node --check _unpacked/package/lib/tunnel-control.mjs
          if tar -tzf dsh-dots-2.0.1-test.6.tgz | grep -Ei '/(tunnel-client|cloudflared)(\.exe)?$'; then
            echo 'Unexpected tunnel client binary in Dots package'; exit 1
          fi
      - name: Download and test official platform tunnel client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _official
          gh api repos/openai/tunnel-client/releases/latest > _official/release.json
          tag=$(node -p 'require("./_official/release.json").tag_name')
          if [ "$RUNNER_OS" = Windows ]; then platform=windows; else platform=linux; fi
          gh release download "$tag" --repo openai/tunnel-client --pattern "tunnel-client-$tag-$platform-amd64.zip" --dir _official
          DOTS_TUNNEL_OFFICIAL_DIR="$PWD/_official" node --test tests/tunnel-official.test.mjs
      - name: Install into real DSH 0.2.2-rc.1 and run native acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix _native --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1
          mkdir -p _native/node_modules/dsh-dots native-evidence
          tar -xzf dsh-dots-2.0.1-test.6.tgz -C _native/node_modules/dsh-dots --strip-components=1
          DSH_NATIVE_ROOT="$PWD/_native" DSH_TEST_OUTPUT="$PWD/native-evidence" node tests/native/verify.mjs
      - name: Commit verified compiled runtime and notices
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/2.0.1-test.6" --jq .object.sha)
          test "$actual" = "$GITHUB_SHA"
          git add lib THIRD-PARTY-NOTICES.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(dots): ship tested lifecycle and tunnel diagnostics fixes'
            git push origin HEAD:2.0.1-test.6
          fi
      - name: Publish this run's candidate artifacts (no Release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dots-2.0.1-test.6-${{ runner.os }}-candidate
          path: |
            dsh-dots-2.0.1-test.6.tgz
            native-evidence/native-report.json
          retention-days: 14
