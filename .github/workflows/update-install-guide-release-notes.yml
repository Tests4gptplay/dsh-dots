name: Update published installation instructions
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/update-install-guide-release-notes.yml'
      - 'scripts/release-display-v1.0.11/NOTES.md'
permissions:
  contents: read
concurrency:
  group: dsh-dots-installation-notes-v1.0.11
  cancel-in-progress: false
jobs:
  update-notes:
    if: github.repository == 'Tests4gptplay/dsh-dots'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update only the existing release body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/dsh-dots
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/v1.0.11" > "$RUNNER_TEMP/release-before.json"
          jq -e '.tag_name == "v1.0.11" and .draft == false and .prerelease == false' "$RUNNER_TEMP/release-before.json"
          jq -r .body "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/body-before.md"
          test "$(sha256sum "$RUNNER_TEMP/body-before.md" | cut -d' ' -f1)" = 'eeac079caf007ee7ffee56394b1e4ad69e80e519633b2609c66bfb75c9e14209'
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/assets-before.json"
          gh api "repos/$GH_REPO/git/ref/tags/v1.0.11" > "$RUNNER_TEMP/tag-before.json"
          test "$(jq -r .object.sha "$RUNNER_TEMP/tag-before.json")" = '4f7d7151b486865d6532d88d2d9656ca64b82c38'
          gh release edit v1.0.11 --notes-file scripts/release-display-v1.0.11/NOTES.md
          gh api "repos/$GH_REPO/releases/tags/v1.0.11" > "$RUNNER_TEMP/release-after.json"
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/assets-after.json"
          cmp "$RUNNER_TEMP/assets-before.json" "$RUNNER_TEMP/assets-after.json"
          gh api "repos/$GH_REPO/git/ref/tags/v1.0.11" > "$RUNNER_TEMP/tag-after.json"
          cmp "$RUNNER_TEMP/tag-before.json" "$RUNNER_TEMP/tag-after.json"
          jq -r .body "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/body-after.md"
          diff -u <(sed -e '${/^$/d;}' scripts/release-display-v1.0.11/NOTES.md) <(sed -e '${/^$/d;}' "$RUNNER_TEMP/body-after.md")
