name: Publish verified Classic Dots via npm OIDC
on:
  push:
    branches: ['1.0.12']
    paths:
      - '.github/workflows/npm-publish.yml'
      - 'scripts/npm/**'
      - 'release/npm/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scoped-npm-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/1.0.12' && github.repository == 'Tests4gptplay/dsh-dots'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.request.outputs.publish }}
      verify: ${{ steps.request.outputs.verify }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Use the verified pack toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts
      - name: Run existing Dots tests and package whitelist
        run: |
          npm test
          npm run pack:check
          git diff --exit-code -- lib
      - name: Test publication safety gates
        run: node --test scripts/npm/publish-guards.test.mjs
      - name: Build scoped payload and verify every production byte
        run: node scripts/npm/prepare-scoped-npm.mjs npm-dist
      - name: Require an exact reviewed publication manifest
        id: request
        run: node scripts/npm/check-publish-request.mjs
      - name: Include credential-free verification utility
        run: cp scripts/npm/check-registry.mjs npm-dist/check-registry.mjs
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: scoped-npm-package
          path: npm-dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' || needs.prepare.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org/'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: npm-dist
          merge-multiple: true
      - name: Check exact tarball and immutable registry version
        id: registry
        run: node npm-dist/check-registry.mjs
      - name: Publish the verified tarball through npm OIDC
        if: needs.prepare.outputs.publish == 'true' && steps.registry.outputs.exists != 'true'
        env:
          NPM_TARBALL: ${{ steps.registry.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          npm publish "./npm-dist/$NPM_TARBALL" --access public --tag latest --ignore-scripts
      - name: Verify public npm integrity without credentials
        run: node npm-dist/check-registry.mjs --require-present
