name: Verify classic Dots and publish Dot MCP npm package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: Publish reviewed dsh-dot-mcp@1.0.0 via npm Trusted Publishing
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: dots-dual-npm-publication
  cancel-in-progress: false

jobs:
  verify-classic:
    name: Verify existing classic Dots npm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.12
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify 1.0.12 immutable source and runtime
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '806b9f48ea447ef448e5c197d88b8c99229ff509'
          test "$(node -p 'require("./package.json").name')" = 'dsh-dots'
          test "$(node -p 'require("./package.json").version')" = '1.0.12'
          npm run pack:check
          node --check lib/host.js
          node --check lib/client.js
      - name: Verify existing scoped npm version and downloaded bytes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {createHash} from 'node:crypto'
          const r=await fetch('https://registry.npmjs.org/@tests4gptplay%2fdsh-dots/1.0.12')
          assert.equal(r.status,200)
          const p=await r.json()
          assert.equal(p.name,'@tests4gptplay/dsh-dots')
          assert.equal(p.version,'1.0.12')
          const dl=await fetch(p.dist.tarball)
          assert.equal(dl.status,200)
          const data=Buffer.from(await dl.arrayBuffer())
          const sha256=createHash('sha256').update(data).digest('hex')
          assert.equal(sha256,'e03ef368dafcb71368421653148198128aba583461d245a1c755540555aefe9b')
          const response=await fetch('https://registry.npmjs.org/@tests4gptplay%2fdsh-dots',{headers:{Accept:'application/json'}})
          assert.equal(response.status,200)
          const metadata=await response.json()
          console.log(JSON.stringify({
            package:p.name,latest:metadata['dist-tags']?.latest,
            packageDescription:metadata.description??null,
            classicDescription:metadata.versions?.['1.0.12']?.description??null,
            version202StillExists:Boolean(metadata.versions?.['2.0.2']),
            packageRepository:metadata.repository?.url??null,
            packageReadmeChars:metadata.readme?.length??0,
            packageReadmeStart:(metadata.readme??'').slice(0,140)
          }))
          JS

  prepare:
    name: Verify ${{ matrix.package_name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: dsh-dot-mcp
            version: 1.0.0
            ref: c1e957731e4f0c4e533beaaae7c2f5209f86eadc
            sha: c1e957731e4f0c4e533beaaae7c2f5209f86eadc
    steps:
      - name: Read immutable version source in the same repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false
      - name: Install supported Node and npm
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - name: Verify pinned source, tests and compiled production output
        working-directory: source
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          EXPECTED_NAME: ${{ matrix.package_name }}
          EXPECTED_VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node -p 'require("./package.json").name')" = "$EXPECTED_NAME"
          test "$(node -p 'require("./package.json").version')" = "$EXPECTED_VERSION"
          if [ "$EXPECTED_NAME" = "dsh-dot-mcp" ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
            npm test
            npm run pack:check
            git diff --exit-code -- lib THIRD-PARTY-NOTICES.txt
          else
            npm run pack:check
            node --check lib/host.js
            node --check lib/client.js
          fi
      - name: Pack the reviewed source once and verify the exact tarball
        env:
          EXPECTED_NAME: ${{ matrix.package_name }}
          EXPECTED_VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npm-dist
          (cd source && npm pack --ignore-scripts --pack-destination ../npm-dist >/dev/null)
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {createHash} from 'node:crypto'
          import {execFileSync} from 'node:child_process'
          import {readFileSync,writeFileSync} from 'node:fs'
          const name=process.env.EXPECTED_NAME, version=process.env.EXPECTED_VERSION
          const filename=name+'-'+version+'.tgz'
          const bytes=readFileSync('npm-dist/'+filename)
          const manifest=JSON.parse(execFileSync('tar',['-xOzf','npm-dist/'+filename,'package/package.json'],{encoding:'utf8'}))
          assert.equal(manifest.name,name)
          assert.equal(manifest.version,version)
          assert.equal(manifest.repository?.url,'git+https://github.com/Tests4gptplay/dsh-dots.git')
          const record={
            name,version,filename,
            sha256:createHash('sha256').update(bytes).digest('hex'),
            integrity:'sha512-'+createHash('sha512').update(bytes).digest('base64')
          }
          writeFileSync('npm-dist/package-verification.json',JSON.stringify(record,null,2)+'\n')
          console.log(JSON.stringify(record))
          JS
      - name: Read the public npm Registry state
        env:
          EXPECTED_NAME: ${{ matrix.package_name }}
          EXPECTED_VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          const p=JSON.parse(readFileSync('npm-dist/package-verification.json','utf8'))
          const r=await fetch('https://registry.npmjs.org/'+encodeURIComponent(p.name))
          if(r.status===404){console.log(JSON.stringify({name:p.name,registry:'package not published'}));process.exit(0)}
          assert.equal(r.status,200,'Public Registry HTTP status')
          const meta=await r.json()
          const existing=meta.versions?.[p.version]
          if(existing) assert.equal(existing.dist?.integrity,p.integrity,'Immutable version contains different bytes')
          console.log(JSON.stringify({name:p.name,version:p.version,published:!!existing,latest:meta['dist-tags']?.latest,versions:Object.keys(meta.versions??{}).length}))
          JS
      - name: Preserve exact verified publication payload
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.package_name }}-verified
          path: npm-dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish ${{ matrix.package_name }}
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.repository == 'Tests4gptplay/dsh-dots'
    needs: [prepare, verify-classic]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package_name: [dsh-dot-mcp]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: npm-${{ matrix.package_name }}-verified
          path: npm-dist
      - name: Confirm immutable version before publication
        id: registry
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFileSync,appendFileSync} from 'node:fs'
          import {createHash} from 'node:crypto'
          const p=JSON.parse(readFileSync('npm-dist/package-verification.json','utf8'))
          const data=readFileSync('npm-dist/'+p.filename)
          assert.equal(createHash('sha256').update(data).digest('hex'),p.sha256)
          const r=await fetch('https://registry.npmjs.org/'+encodeURIComponent(p.name)+'/'+p.version)
          if(r.status===404){appendFileSync(process.env.GITHUB_OUTPUT,'exists=false\nfilename='+p.filename+'\n');process.exit(0)}
          assert.equal(r.status,200,'Registry version lookup HTTP')
          const existing=await r.json()
          assert.equal(existing.dist?.integrity,p.integrity,'Immutable registry version has different bytes')
          appendFileSync(process.env.GITHUB_OUTPUT,'exists=true\nfilename='+p.filename+'\n')
          JS
      - name: Publish exact package through GitHub OIDC
        if: steps.registry.outputs.exists != 'true'
        env:
          PACKAGE_ARCHIVE: ${{ steps.registry.outputs.filename }}
        shell: bash
        run: npm publish "./npm-dist/$PACKAGE_ARCHIVE" --access public --tag latest --ignore-scripts
      - name: Verify public version, latest tag and downloaded tarball bytes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          import {createHash} from 'node:crypto'
          const p=JSON.parse(readFileSync('npm-dist/package-verification.json','utf8'))
          const r=await fetch('https://registry.npmjs.org/'+encodeURIComponent(p.name))
          assert.equal(r.status,200,'Registry packument HTTP')
          const meta=await r.json()
          assert.equal(meta['dist-tags'].latest,p.version)
          const version=meta.versions?.[p.version]
          assert.equal(version?.dist?.integrity,p.integrity)
          const response=await fetch(version.dist.tarball)
          assert.equal(response.status,200,'Published tarball download HTTP')
          const bytes=Buffer.from(await response.arrayBuffer())
          assert.equal(createHash('sha256').update(bytes).digest('hex'),p.sha256)
          console.log(JSON.stringify({name:p.name,version:p.version,latest:meta['dist-tags'].latest,sha256:p.sha256,bytes:bytes.length}))
          JS
