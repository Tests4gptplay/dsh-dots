name: Publish both DSH Dots npm packages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-dots-unscoped-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.npm_name }}@${{ matrix.npm_version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_ref: main
            npm_name: dsh-dot-mcp
            npm_version: 1.0.0
          - source_ref: '1.0.12'
            npm_name: dsh-dots
            npm_version: 1.0.12
    env:
      NPM_NAME: ${{ matrix.npm_name }}
      NPM_VERSION: ${{ matrix.npm_version }}
    steps:
      - name: Checkout the matching product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org/
      - name: Install npm with Trusted Publisher OIDC support
        run: npm install --global npm@11.9.0 --ignore-scripts
      - name: Validate MCP source and compile exact runtime
        if: matrix.npm_name == 'dsh-dot-mcp'
        working-directory: source
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm test
          npm run pack:check
          git diff --exit-code -- lib THIRD-PARTY-NOTICES.txt
      - name: Validate original simple Dots package
        if: matrix.npm_name == 'dsh-dots'
        working-directory: source
        run: npm run pack:check
      - name: Build and inspect the release tarball
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(p.name!==process.env.NPM_NAME||p.version!==process.env.NPM_VERSION||p.repository?.url!=="git+https://github.com/Tests4gptplay/dsh-dots.git")process.exit(1)'
          npm pack --ignore-scripts
          tar -xOf "${NPM_NAME}-${NPM_VERSION}.tgz" package/package.json > /tmp/dots-packed-package.json
          node -e 'const p=require("/tmp/dots-packed-package.json"); if(p.name!==process.env.NPM_NAME||p.version!==process.env.NPM_VERSION)process.exit(1)'
          sha256sum "${NPM_NAME}-${NPM_VERSION}.tgz"
      - name: Publish immutable tarball through npm Trusted Publisher
        shell: bash
        run: |
          set -euo pipefail
          FILE="source/${NPM_NAME}-${NPM_VERSION}.tgz"
          if npm view "${NPM_NAME}@${NPM_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${NPM_NAME}@${NPM_VERSION} already exists; comparing actual published bytes"
          else
            npm publish "$FILE" --access public --tag latest --ignore-scripts
          fi
      - name: Verify exact public registry tarball, version and repository
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          import {createHash} from 'node:crypto'
          const name=process.env.NPM_NAME, version=process.env.NPM_VERSION
          const file='source/'+name+'-'+version+'.tgz'
          const local=readFileSync(file)
          const response=await fetch('https://registry.npmjs.org/'+encodeURIComponent(name))
          assert.equal(response.status,200,'npm registry package not found')
          const meta=await response.json()
          const found=meta.versions?.[version]
          assert.equal(found?.name,name)
          assert.equal(found?.repository?.url,'git+https://github.com/Tests4gptplay/dsh-dots.git')
          const download=await fetch(found.dist.tarball)
          assert.ok(download.ok,'npm public archive inaccessible')
          const remote=Buffer.from(await download.arrayBuffer())
          assert.ok(local.equals(remote),'npm archive differs from built candidate')
          console.log(JSON.stringify({package:name,version,sha256:createHash('sha256').update(remote).digest('hex'),bytes:remote.length,latest:meta['dist-tags']?.latest}))
          JS
