name: Verify DSH Dots one-shot Tunnel startup
on:
  push:
    branches: ['2.0.1-test.10']
permissions:
  contents: read
jobs:
  verify:
    name: Tunnel startup regression / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Compile and run all source regressions
        run: npm test
      - name: Check production files and compiled output
        shell: bash
        run: |
          npm run pack:check
          git diff --exit-code -- lib THIRD-PARTY-NOTICES.txt
      - name: Pack the test candidate
        run: npm pack --ignore-scripts
      - name: Chromium Settings layout regressions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser/settings-layout.py
      - name: Install native DSH 0.2.2-rc.1
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-native"
          cd "$RUNNER_TEMP/dsh-native"
          npm init -y
          npm install --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1 @deepseek-ai/dsh-client-connection@0.2.2-rc.1 @deepseek-ai/dsh-api-gateway@0.2.2-rc.1 @deepseek-ai/dsh-api-session-controller@0.2.2-rc.1 @deepseek-ai/dsh-api-remote-access@0.2.2-rc.1 @deepseek-ai/dsh-typert-registry@0.2.2-rc.1
          mkdir -p node_modules/dsh-dots
          tar -xzf "$GITHUB_WORKSPACE/dsh-dots-2.0.1-test.10.tgz" --strip-components=1 -C node_modules/dsh-dots
      - name: Installed native DSH and Chromium acceptance
        if: runner.os == 'Linux'
        env:
          DSH_NATIVE_ROOT: ${{ runner.temp }}/dsh-native
          DSH_TEST_OUTPUT: ${{ runner.temp }}/dots-native-evidence
          DSH_BROWSER_TEST: '1'
        run: node tests/native/verify.mjs
      - name: Preserve candidate and run evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dots-2.0.1-test.10-${{ matrix.os }}
          path: |
            dsh-dots-2.0.1-test.10.tgz
            ui-evidence/
            ${{ runner.temp }}/dots-native-evidence/
          if-no-files-found: ignore
          retention-days: 14
