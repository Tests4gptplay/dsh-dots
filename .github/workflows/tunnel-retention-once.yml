name: Verify Dots tunnel retention candidate
# Rerun after correcting test callback argument handling.
on:
  push:
    branches: ['2.0.1-test.3']
    paths: ['.github/workflows/tunnel-retention-once.yml']
permissions:
  contents: write
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and run source regressions
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm test
          npm run pack:check
      - name: Exercise original OpenAI tunnel-client binary (local test endpoint)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _official
          gh api repos/openai/tunnel-client/releases/latest > _official/release.json
          tag=$(node -p 'require("./_official/release.json").tag_name')
          gh release download "$tag" --repo openai/tunnel-client --pattern "tunnel-client-$tag-linux-amd64.zip" --dir _official
          DOTS_TUNNEL_OFFICIAL_DIR="$GITHUB_WORKSPACE/_official" node --test tests/tunnel-official.test.mjs
      - name: Validate final distribution
        run: |
          set -euo pipefail
          npm run pack:check
          npm pack --ignore-scripts
          if tar -tzf dsh-dots-2.0.1-test.3.tgz | grep -Ei '/(tunnel-client|cloudflared)(\.exe)?$'; then
            echo "Official binary found in Dots package"; exit 1
          fi
          sha256sum dsh-dots-2.0.1-test.3.tgz > SHA256SUMS.txt
          git diff --check
      - name: Commit generated production files
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/2.0.1-test.3" --jq .object.sha)
          test "$actual" = "$GITHUB_SHA"
          git add lib THIRD-PARTY-NOTICES.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(dots): regenerate tunnel cleanup production bundle'
            git push origin HEAD:2.0.1-test.3
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dots-tunnel-retention-candidate
          path: |
            dsh-dots-2.0.1-test.3.tgz
            SHA256SUMS.txt
          retention-days: 14
