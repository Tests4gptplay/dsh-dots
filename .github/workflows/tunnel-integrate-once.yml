name: Recover Dots tunnel implementation
on:
  push:
    branches: ['2.0.1-test.2']
    paths: ['.github/workflows/tunnel-integrate-once.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve saved source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > dots-tunnel.patch.gz
          for blob in a5c34b395c34c6c77ff5265c2e2992048f8f7a19 73ee8eba8fce7a86642bba1663cb7f2edbe6824d 4df722ded33ec2c711fad49ee49f213187f756de 67352e85303b454aebbaa380383721d6fc138d29 7e1d674ffe563aba91e17da325b199b189cc97a1 98d378a00ed222cf38c87ba22215d9f49c39b223; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 -d >> dots-tunnel.patch.gz
          done
          echo 'a06a1e20f7f938b3d62f6e96ab0fbee3992ea86cd01562f27576b2fe61481e47  dots-tunnel.patch.gz' | sha256sum --check
          gzip -dc dots-tunnel.patch.gz > dots-tunnel.patch
          sed -n '/^diff --git a\/package.json/,/^diff --git /p' dots-tunnel.patch
          git archive --format=zip --output=branch-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: dots-tunnel-recovered-source
          path: |
            dots-tunnel.patch
            branch-source.zip
          retention-days: 7
