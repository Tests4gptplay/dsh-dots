name: Verify optional Dots notifications
on:
  push:
    branches: ['2.0.1-test.7']
    paths: ['.github/workflows/dots-notify-once.yml']
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Source and official MCP integration regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm test
          npm run pack:check
          npm pack --ignore-scripts
          mkdir -p _unpacked
          tar -xzf dsh-dots-2.0.1-test.7.tgz -C _unpacked
          node --check _unpacked/package/lib/notify-control.mjs
          node --check _unpacked/package/lib/mcp-server.mjs
      - name: Real native DSH 0.2.2-rc.1 acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix _native --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1
          mkdir -p _native/node_modules/dsh-dots native-evidence
          tar -xzf dsh-dots-2.0.1-test.7.tgz -C _native/node_modules/dsh-dots --strip-components=1
          DSH_NATIVE_ROOT="$PWD/_native" DSH_TEST_OUTPUT="$PWD/native-evidence" node tests/native/verify.mjs
      - name: Commit verified production outputs
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/2.0.1-test.7" --jq .object.sha)
          test "$actual" = "$GITHUB_SHA"
          git add lib THIRD-PARTY-NOTICES.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(dots): include verified opt-in MCP Events runtime'
            git push origin HEAD:2.0.1-test.7
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dots-2.0.1-test.7-${{ runner.os }}
          path: |
            dsh-dots-2.0.1-test.7.tgz
            native-evidence/native-report.json
          retention-days: 14
