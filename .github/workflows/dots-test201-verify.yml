name: Dots 2.0.2-test.1 saved-Tunnel-start acceptance
on:
  push:
    branches: ['2.0.2-test.1']
permissions:
  contents: read
jobs:
  verify:
    name: Windows and native DSH / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Source and regression tests
        run: npm test
      - name: Verify compiled runtime and package whitelist
        shell: bash
        run: |
          npm run pack:check
          git diff --exit-code -- lib THIRD-PARTY-NOTICES.txt
      - name: Build candidate package
        run: npm pack --ignore-scripts
      - name: Chromium layout regression
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser/settings-layout.py
      - name: Install actual DSH 0.2.2-rc.1
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-native"
          cd "$RUNNER_TEMP/dsh-native"
          npm init -y
          npm install --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1 @deepseek-ai/dsh-client-connection@0.2.2-rc.1 @deepseek-ai/dsh-api-gateway@0.2.2-rc.1 @deepseek-ai/dsh-api-session-controller@0.2.2-rc.1 @deepseek-ai/dsh-api-remote-access@0.2.2-rc.1 @deepseek-ai/dsh-typert-registry@0.2.2-rc.1
          mkdir -p node_modules/dsh-dots
          tar -xzf "$GITHUB_WORKSPACE/dsh-dots-2.0.2-test.1.tgz" --strip-components=1 -C node_modules/dsh-dots
      - name: Native DSH and Chromium acceptance
        if: runner.os == 'Linux'
        env:
          DSH_NATIVE_ROOT: ${{ runner.temp }}/dsh-native
          DSH_TEST_OUTPUT: ${{ runner.temp }}/dots-native-evidence
          DSH_BROWSER_TEST: '1'
        run: node tests/native/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dots-test201-${{ matrix.os }}-evidence
          path: |
            dsh-dots-2.0.2-test.1.tgz
            ui-evidence/
            ${{ runner.temp }}/dots-native-evidence/
          if-no-files-found: ignore
          retention-days: 14
