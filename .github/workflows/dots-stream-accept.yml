name: Dots continuous MCP stream candidate acceptance
on:
  push:
    branches: ['2.0.1-test.4']
    paths: ['.github/workflows/dots-stream-accept.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and run MCP and existing regressions
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm test | tee "$RUNNER_TEMP/stream-tests.log"
          npm run pack:check
      - name: Pack and verify production file list
        run: |
          set -euo pipefail
          npm pack --ignore-scripts
          mkdir -p _unpacked
          tar -xzf dsh-dots-2.0.1-test.4.tgz -C _unpacked
          node --check _unpacked/package/lib/mcp-adapter.mjs
          node --check _unpacked/package/lib/mcp-server.mjs
          node --check _unpacked/package/lib/host.js
          if tar -tzf dsh-dots-2.0.1-test.4.tgz | grep -Ei '/(tunnel-client|cloudflared)(\.exe)?$'; then
            echo 'Client binary should not enter the Dots bundle'; exit 1
          fi
          sha256sum dsh-dots-2.0.1-test.4.tgz > SHA256SUMS.txt
      - name: Native DSH Web 0.2.2-rc.1 package acceptance
        run: |
          set -euo pipefail
          mkdir -p _native
          npm install --prefix _native --legacy-peer-deps --no-audit --no-fund \
            @deepseek-ai/dsh@0.2.2-rc.1 "$PWD/dsh-dots-2.0.1-test.4.tgz"
          mkdir -p native-evidence
          DSH_NATIVE_ROOT="$PWD/_native" DSH_TEST_OUTPUT="$PWD/native-evidence" \
            node tests/native/verify.mjs | tee "$RUNNER_TEMP/native-stream-acceptance.log"
      - name: Commit generated and tested production files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/2.0.1-test.4" --jq .object.sha)
          test "$actual" = "$GITHUB_SHA"
          git add lib THIRD-PARTY-NOTICES.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(dots): ship verified continuous MCP stream bridge'
            git push origin HEAD:2.0.1-test.4
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dots-2.0.1-test.4-live-stream-acceptance
          path: |
            dsh-dots-2.0.1-test.4.tgz
            SHA256SUMS.txt
            native-evidence/
            _unpacked/package/package.json
          retention-days: 14
