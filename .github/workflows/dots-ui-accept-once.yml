name: Dots Settings UI verification
on:
  push:
    branches: ['2.0.1-test.8']
    paths: ['.github/workflows/dots-ui-accept-once.yml']
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the exact locally rendered source changes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ui-layout-prepare.py
          python scripts/ui-native-layout-prepare.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'src/styles.css': '9bb9de03bb80a96ed7d9ecc3de328bffd7cc6f3d9862489b5f75036ba9fc41b5',
            'src/client.js': 'cdcda6fded744c6b68db9e8a2f93cdc9514e98c4942f7edc621d6cc5268ace49',
            'src/mcp-settings.js': '33599b4b26ad2925ba6ccb90248f641e65099a0746761463af68e1ee5a75e8bc',
            'src/tunnel-settings.js': 'a7090126a604f9230c8500b5babb7831b182e31cc43ec16565db951f1560a108',
            'src/notify-settings.js': 'f35d2805ab0c9defa756229cebcba412a02201128df1dd3fbdab23bde4c1ac93',
          }
          for name, digest in expected.items():
              actual=hashlib.sha256(Path(name).read_text(encoding='utf-8').encode()).hexdigest()
              assert actual==digest,(name,actual,digest)
          print('PASS: rendered local Settings sources match candidate sources')
          PY
      - name: Build, regression tests and final package
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm test
          npm run pack:check
          npm pack --ignore-scripts
          mkdir -p _unpacked
          tar -xzf dsh-dots-2.0.1-test.8.tgz -C _unpacked
          node --check _unpacked/package/lib/client.js
          node --check _unpacked/package/lib/host.js
      - name: Chromium layouts with actual production Client
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          DSH_UI_OUTPUT="$RUNNER_TEMP/dots-ui-layout" python tests/browser/settings-layout.py
          mkdir -p docs/screenshots/v2.0.1-test.8
          cp "$RUNNER_TEMP/dots-ui-layout/notify-light-zh-530.png" docs/screenshots/v2.0.1-test.8/notify-light.png
          cp "$RUNNER_TEMP/dots-ui-layout/notify-dark-zh-530.png" docs/screenshots/v2.0.1-test.8/notify-dark.png
          cp "$RUNNER_TEMP/dots-ui-layout/tunnel-light-zh-530.png" docs/screenshots/v2.0.1-test.8/tunnel-light.png
      - name: Real DSH 0.2.2-rc.1 and Chromium Settings acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix _native --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1
          mkdir -p _native/node_modules/dsh-dots
          tar -xzf dsh-dots-2.0.1-test.8.tgz -C _native/node_modules/dsh-dots --strip-components=1
          DSH_NATIVE_ROOT="$PWD/_native" DSH_TEST_OUTPUT="$RUNNER_TEMP/dots-native-ui" DSH_BROWSER_TEST=1 node tests/native/verify.mjs
      - name: Prepare verified source and runtime for the final commit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          tar -czf "$RUNNER_TEMP/ui-verified-source.tgz" src lib tests docs README.md README.en.md CHANGELOG.md package.json package-lock.json THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dots-ui-${{ runner.os }}-evidence
          path: |
            dsh-dots-2.0.1-test.8.tgz
            ${{ runner.temp }}/dots-ui-layout/*.png
            ${{ runner.temp }}/dots-ui-layout/layout-report.json
            ${{ runner.temp }}/dots-native-ui/
            ${{ runner.temp }}/ui-verified-source.tgz
          retention-days: 14
  commit:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dots-ui-Linux-evidence
          path: _accepted
      - name: Commit only the verified source, runtime, and user-facing UI record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find _accepted -name ui-verified-source.tgz -print -quit)
          test -n "$archive"
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/2.0.1-test.8" --jq .object.sha)
          test "$actual" = "$GITHUB_SHA"
          tar -xzf "$archive"
          git add src lib tests docs README.md README.en.md CHANGELOG.md package.json package-lock.json THIRD-PARTY-NOTICES.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui(dots): ship aligned Settings controls with verified native Chromium layout'
          git push origin HEAD:2.0.1-test.8
