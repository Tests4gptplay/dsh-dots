name: Remove redundant DSH Dots 2.0.0 branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dots-remove-obsolete-branch.yml']
permissions:
  contents: write
jobs:
  remove:
    if: github.repository == 'Tests4gptplay/dsh-dots'
    runs-on: ubuntu-latest
    steps:
      - name: Delete redundant branch and preserve immutable v2.0.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/2.0.0" --jq '.object.sha')
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.0" --jq '.object.sha')
          test "$branch_sha" = '789faf1a52af2acbd1852b8972da5d8d42fc56b9'
          test "$tag_sha" = "$branch_sha"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/2.0.0" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.0" --jq '.object.sha'
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.12" --jq '.object.sha'
          echo "Deleted only 2.0.0 branch; retained v2.0.0 and v1.0.12 tags."
