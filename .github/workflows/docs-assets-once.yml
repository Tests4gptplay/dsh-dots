name: Import verified 2.0.0 documentation screenshots
on:
  push:
    branches: ['2.0.0']
    paths: ['.github/workflows/docs-assets-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '2.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: dots-2.0.0-verification-ubuntu-latest
          run-id: 42632878019
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-dots
      - name: Import unchanged screenshots from the verified native run
        env:
          INPUT: ${{ runner.temp }}/verified-dots
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil
          source = Path(os.environ['INPUT'])
          target = Path('docs/screenshots/v2.0.0')
          target.mkdir(parents=True, exist_ok=True)
          expected = {
              'native-settings-off.png': '7c912b6e2fbcade5027361865750a82389e6cd5c35881ed0b9886d4323026ee4',
              'native-settings-on.png': '8a0ea1587720b8b2a5d47d7d8183b352fb8f0820bb6da9e528bb582c2d8607e1',
              'native-connection-guide.png': '8307de9721080eda0f2552e67367205100bb1b007829aba8ece29735739419e7',
          }
          for name, digest in expected.items():
              matches = list(source.rglob(name))
              assert len(matches) == 1, (name, matches)
              assert hashlib.sha256(matches[0].read_bytes()).hexdigest() == digest, name
              shutil.copyfile(matches[0], target / name)
          PY
      - name: Commit documentation assets and remove this one-time transfer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/v2.0.0
          git rm .github/workflows/docs-assets-once.yml
          git commit -m 'docs: add original native 2.0.0 settings and setup screenshots'
          git push origin HEAD:2.0.0
