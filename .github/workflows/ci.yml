name: DSH Dots cases
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    name: DSH installability / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The real host source is a test fixture only; it is never installed or
      # copied into the plugin's release package. Pin a known source fixture
      # for repeatability; the plugin itself never gates runtime by DSH version.
      - name: Checkout DSH interface sources
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.1-rc.3
          path: _dsh-host-source
          sparse-checkout: |
            packages/client/ui-schedule/src/client
            packages/client/ui-sidebar-browser
            apps/desktop/src/browser-guests.ts
            apps/desktop/src/preload-browser.ts
      - name: Native-slot, mock conversation and host-source tests
        run: npm test
        env:
          DSH_SOURCE_DIR: _dsh-host-source
      - name: Verify packaged file whitelist
        run: npm run pack:check
      - name: Check distributable can be installed without running scripts
        shell: bash
        run: |
          npm pack --ignore-scripts
          mkdir -p _package-test
          cd _package-test
          npm install --offline --legacy-peer-deps --ignore-scripts --no-audit --no-fund "../$(node -p 'require("../package.json").name + "-" + require("../package.json").version + ".tgz"')"
          node --input-type=module -e 'import("dsh-dots").then(x=>{if(x.name!=="dsh-dots")process.exit(1)})'
          node --input-type=module -e 'import zh from "dsh-dots/locale/zh.json" with {type:"json"}; import en from "dsh-dots/locale/en.json" with {type:"json"}; if(!zh.meta.title || !en.meta.title)process.exit(1)'
      - name: Verify local TGZ installation with pnpm
        shell: bash
        run: |
          npm install -g pnpm@10
          mkdir -p _pnpm-package-test
          cd _pnpm-package-test
          printf '%s\n' '{"name":"dsh-dots-install-check","private":true}' > package.json
          pnpm add "../$(node -p 'require("../package.json").name + "-" + require("../package.json").version + ".tgz"')" --ignore-scripts --config.auto-install-peers=false
          node --input-type=module -e 'import("dsh-dots").then(x=>{if(x.name!=="dsh-dots")process.exit(1)})'

